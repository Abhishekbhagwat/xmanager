syntax = "proto3";

package xmanager;

message Job {
  oneof kind {
    LocalJob local = 1;
    AIPlatformJob caip = 2;
    KubernetesJob kubernetes = 3;
    VertexTrainingClusterJob vertex_training_cluster = 4;
  }
}

message LocalJob {
  // The identity of the job as identified by `ps -o pid,cmd,etime`.
  // etime is then converted to an unix timestamp
  string pid = 1;
  string cmd = 2;
  int64 timestamp = 3;
}

message AIPlatformJob {
  // The resource name of the job. This will be in the form:
  // projects/{project}/locations/{location}/customJobs/{customJobId}
  string resource_name = 1;
}

message KubernetesJob {
  // Namespace of the kubernetes job.
  string namespace = 1;
  // Name of the kubernetes job.
  string job_name = 2;
}

message VertexTrainingClusterJob {
  // The SLURM job ID for the training cluster job.
  string slurm_job_id = 1;
  // The login node for the training cluster.
  string login_node = 2;
  // The type of cluster.
  string cluster_type = 3;
  // The partition where the job is running.
  string partition = 4;
  // Whether to use gcloud compute ssh.
  bool use_gcloud_ssh = 5;
  // SSH hostname override for gcloud ssh.
  string ssh_hostname = 6;
  // Working directory on cluster.
  string work_dir = 7;
}
