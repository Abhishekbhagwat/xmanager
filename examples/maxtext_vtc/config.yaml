base_config: "base.yml"
model_name: llama3.1-70b

hardware: gpu_multiprocess
dcn_data_parallelism: 1
dcn_fsdp_parallelism: 2
ici_fsdp_parallelism: 8
per_device_batch_size: 1
max_target_length: 8192
learning_rate: 0.001
enable_checkpointing: true
checkpoint_period: 10
async_checkpointing: true
save_checkpoint_on_completion: true
attention: cudnn_flash_te
remat_policy: full
use_iota_embed: true
logits_dot_in_fp32: false
scan_layers: True
enable_goodput_recording: false
monitor_goodput: false
save_config_to_gcs: true
tensorboard_dir: gs://ai-infra-gcs-europe-west4

# Dataset Configration

# Option1: Synthetic
# dataset_type: synthetic

# Option2: c4en dataset
dataset_path: gs://checkpoint-dsm-a3-ultra-4f4d88d2
dataset_type: tfds
dataset_name: c4/en:3.0.1
train_split: train
eval_split: validation
eval_tokens: 60000
add_bos: false
add_eos: false

# # Vertex AI Tensorboard Logging
# use_vertex_tensorboard: True
# vertex_tensorboard_project: "ai-infra-recipe-validation"
# # Vertex AI supported regions: https://cloud.google.com/vertex-ai/docs/general/locations#available-regions
