# MaxText Training Configuration
# This is a template configuration file for MaxText training on Vertex Training Cluster.
# Fill in the values according to your model, data, and training requirements.

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Model architecture name (e.g., 'llama2', 'gpt3', 'palm')
  name: ''

  # Model size configuration
  # For predefined sizes (e.g., '7b', '13b', '70b'), or custom parameters below
  size: ''

  # Custom model dimensions (if not using predefined size)
  num_layers: 0              # Number of transformer layers
  num_heads: 0               # Number of attention heads
  num_kv_heads: 0            # Number of key-value heads (for GQA/MQA)
  embed_dim: 0               # Embedding dimension (d_model)
  mlp_dim: 0                 # MLP hidden dimension
  head_dim: 0                # Dimension per attention head

  # Vocabulary and sequence
  vocab_size: 0              # Vocabulary size
  max_seq_length: 0          # Maximum sequence length (context window)

  # Architectural choices
  use_flash_attention: true  # Use FlashAttention for efficiency
  use_rotary_embedding: true # Use RoPE (Rotary Position Embedding)
  normalize_embedding_logits: false
  logits_via_embedding: false

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Training steps
  steps: 0                   # Total training steps
  save_period: 1000          # Checkpoint save frequency (steps)
  log_period: 10             # Logging frequency (steps)
  eval_period: 500           # Evaluation frequency (steps)

  # Batch configuration
  per_device_batch_size: 0   # Batch size per GPU/TPU device
  global_batch_size: 0       # Total batch size across all devices
  # Note: global_batch_size = per_device_batch_size * num_devices * gradient_accumulation_steps

  # Optimization
  learning_rate: 0.0         # Peak learning rate (e.g., 3e-4)
  lr_schedule: 'cosine'      # Learning rate schedule: 'cosine', 'linear', 'constant'
  warmup_steps: 0            # Number of warmup steps
  end_learning_rate: 0.0     # Final learning rate (for cosine/linear schedules)

  optimizer: 'adamw'         # Optimizer: 'adamw', 'adam', 'sgd'
  weight_decay: 0.0          # Weight decay coefficient
  adam_b1: 0.9               # Adam beta1
  adam_b2: 0.95              # Adam beta2
  adam_eps: 1.0e-8           # Adam epsilon
  grad_clip: 1.0             # Gradient clipping threshold

  # Mixed precision
  dtype: 'bfloat16'          # Data type: 'float32', 'bfloat16', 'float16'
  enable_checkpointing: true # Enable gradient checkpointing to save memory

  # Parallelism strategies
  ici_tensor_parallelism: 1  # Intra-node tensor parallelism
  ici_fsdp_parallelism: 1    # Intra-node FSDP (Fully Sharded Data Parallelism)
  dcn_tensor_parallelism: 1  # Inter-node tensor parallelism
  dcn_fsdp_parallelism: 1    # Inter-node FSDP
  # Product of all parallelism values should equal total number of devices

  # Random seed
  seed: 42

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Input data paths
  dataset_name: ''           # Dataset name or identifier
  dataset_type: ''           # Dataset type: 'tfrecord', 'tfds', 'grain', 'huggingface'

  # Data paths (choose based on dataset_type)
  tfrecord_path: ''          # Path to TFRecord files (if using tfrecord)
  grain_train_files: ''      # Path to Grain training files (if using grain)
  huggingface_path: ''       # HuggingFace dataset path (if using huggingface)

  # Data processing
  shuffle_buffer_size: 10000 # Shuffle buffer size for data loading
  num_workers: 8             # Number of data loading workers
  prefetch_size: 2           # Number of batches to prefetch

  # Tokenization
  tokenizer_path: ''         # Path to tokenizer model (e.g., SentencePiece model)
  add_bos: true              # Add beginning-of-sequence token
  add_eos: true              # Add end-of-sequence token

  # Evaluation data (optional)
  eval_dataset_name: ''      # Evaluation dataset name
  eval_split: 'validation'   # Evaluation split

# =============================================================================
# Output Configuration
# =============================================================================
output:
  # Base output directory (GCS bucket or local path)
  # This will be set by the launcher via command line args
  # base_output_directory: 'gs://my-bucket/experiments'

  # Checkpoint settings
  checkpoint_dir: 'checkpoints'  # Subdirectory for checkpoints (relative to base_output_directory)
  max_checkpoints_to_keep: 5     # Maximum number of checkpoints to retain
  save_optimizer_state: true     # Save optimizer state in checkpoints

  # Logging
  log_dir: 'logs'                # Subdirectory for logs (relative to base_output_directory)
  tensorboard_dir: 'tensorboard' # Subdirectory for TensorBoard logs
  enable_profiler: false         # Enable JAX profiler
  profiler_steps: 5              # Number of steps to profile (if enabled)

# =============================================================================
# Hardware Configuration
# =============================================================================
hardware:
  # These are typically inferred from the cluster, but can be overridden
  num_hosts: 0               # Number of nodes (set by launcher via requirements.replicas)
  num_devices_per_host: 8    # GPUs per node (cluster-specific: 8 for H100/H200/B200)

  # Hardware-specific optimizations
  enable_xla_optimizations: true
  xla_flags: ''              # Additional XLA flags (optional)

# =============================================================================
# Advanced Configuration
# =============================================================================
advanced:
  # Numerical stability
  numerical_stability: 'high'  # 'high', 'medium', 'low'

  # Communication settings
  collective_matmul: true
  latency_optimized_collective_communication: false

  # Debugging
  log_config_on_startup: true
  detailed_logging: false

  # Experimental features
  scan_layers: false         # Use scan over transformer layers
  remat_policy: 'minimal'    # Rematerialization policy: 'none', 'minimal', 'full'

# =============================================================================
# Notes
# =============================================================================
# 1. The run_name and base_output_directory are typically passed via command
#    line arguments by the XManager launcher.
#
# 2. Adjust parallelism settings based on your hardware:
#    - For single-node: Use ici_fsdp_parallelism = num_gpus
#    - For multi-node: Distribute across ici_* and dcn_* dimensions
#
# 3. Memory optimization tips:
#    - Reduce per_device_batch_size if OOM
#    - Enable gradient checkpointing (enable_checkpointing: true)
#    - Use bfloat16 dtype
#    - Increase FSDP parallelism
#
# 4. Common cluster configurations:
#    - hcc-a4 (B200): 8 GPUs per node, 192GB HBM3e per GPU
#    - hcc-a3u (H200): 8 GPUs per node, 141GB HBM3e per GPU
#    - hcc-a3m (H100): 8 GPUs per node, 80GB HBM3 per GPU
